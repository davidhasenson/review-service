apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: pensionat-review-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: DB_URL
              value: jdbc:mysql://review-db:3306/reviewdb
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: review-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: review-secrets
                  key: JWT_SECRET

---

apiVersion: v1
kind: Service
metadata:
  name: review-service
spec:
  type: LoadBalancer
  selector:
    app: review-service
  ports:
    - port: 8082
      targetPort: 8082