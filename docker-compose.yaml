services:

  review-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: review_db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$DB_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  review-service:
    build: .
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://review-db:3306/review_db
    depends_on:
      review-db:
        condition: service_healthy